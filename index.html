<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Hello World</title>
  <style>
    h1, h3 { color: black; cursor: pointer; }
  </style>
</head>

<body>
  <h1>Hello World!</h1>
  <h3>Amy S.Kim</h3>
    <p>I created my own web page. I am still very, very new to coding, but I will keep learning.</p>
  <script>
    document.querySelector('h1').addEventListener('click', function () {
      this.style.color = 'red';
    });

    document.querySelector('h3').addEventListener('click', function () {
      this.style.color = 'blue';
    });
  </script>
</body>
</html>
